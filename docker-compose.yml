services:
  api:
    build:
      context: ./apps/api
    container_name: crumbkeeper-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: crumbkeeper-postgres
    restart: always
    environment:
      POSTGRES_USER: crumbkeeper
      POSTGRES_PASSWORD: crumbkeeper
      POSTGRES_DB: crumbkeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crumbkeeper-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: